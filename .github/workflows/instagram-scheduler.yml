name: Dornelas Instagram Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  publish-approved-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run due approved Instagram posts
        env:
          DORNELAS_URL: https://dornelas-ia.onrender.com
          SCHEDULER_SECRET: ${{ secrets.DORNELAS_SCHEDULER_SECRET }}
        run: |
          if [ -z "$SCHEDULER_SECRET" ]; then
            echo "Missing repository secret DORNELAS_SCHEDULER_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SCHEDULER_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$DORNELAS_URL/agent/scheduler/run"
