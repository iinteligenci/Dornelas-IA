services:
  - type: web
    name: dornelas-ia-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: META_CLIENT_ID
        sync: false
      - key: META_CLIENT_SECRET
        sync: false
      - key: META_CONFIG_ID
        value: "28133500806327551"
      - key: META_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: LOVABLE_API_KEY
        sync: false
      - key: LOVABLE_AI_GATEWAY_URL
        value: "https://ai.gateway.lovable.dev/v1"
      - key: AI_MODEL
        value: "google/gemini-2.5-flash"
      - key: SITE_URL
        value: "https://iinteligenci.github.io/Site-dornelas/"
      - key: AI_IMAGE_MODEL
        sync: false
      - key: CONTENT_ASSET_REPO
        value: "iinteligenci/dorn"
